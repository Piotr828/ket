<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symulacja Kwantowa E91 (CHSH)</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #141414;
            --text-color: #e0e0e0;
            --border-color: #333;
            --alice-color: #00e5ff;
            --bob-color: #ff00ff;
            --accent-color: #4CAF50;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Nagłówek */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .score-board { font-size: 1.5rem; font-weight: bold; }
        
        .toggle-container { display: flex; align-items: center; gap: 12px; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-toggle {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555; transition: .3s; border-radius: 26px;
        }
        .slider-toggle:before {
            position: absolute; content: ""; height: 18px; width: 18px;
            left: 4px; bottom: 4px; background-color: white;
            transition: .3s; border-radius: 50%;
        }
        input:checked + .slider-toggle { background-color: var(--accent-color); }
        input:checked + .slider-toggle:before { transform: translateX(24px); }

        /* Główny kontener */
        main { display: flex; flex: 1; position: relative; }
        
        .panel {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            padding: 30px 20px; border-right: 1px solid var(--border-color);
        }
        .panel:last-child { border-right: none; }

        h2 { font-size: 2rem; margin-bottom: 15px; letter-spacing: 2px; }
        #alice-panel h2 { color: var(--alice-color); }
        #bob-panel h2 { color: var(--bob-color); }

        .bit-display {
            background: rgba(255,255,255,0.05); padding: 10px 25px;
            border-radius: 8px; font-size: 1.2rem; margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Płótno Canvas */
        canvas {
            border-radius: 50%;
            background-color: transparent;
            margin-bottom: 25px;
        }

        /* Kontrolki (Suwak i Przycisk) */
        .controls { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 15px; }
        .slider-label { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #aaa; }

        .preset-angles { display: flex; gap: 5px; margin-bottom: 8px; }
        .preset-angles button {
            flex: 1; padding: 6px 0; background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color); color: var(--text-color);
            border-radius: 4px; cursor: pointer; transition: 0.2s; font-size: 0.9rem;
        }
        .preset-angles button:hover { background: rgba(255,255,255,0.15); }
        .preset-angles button:disabled { opacity: 0.3; cursor: not-allowed; }

        button.measure-btn {
            background: transparent; padding: 15px; border-radius: 6px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer;
            transition: 0.2s; color: var(--text-color);
            border: 1px solid var(--border-color);
        }
        button.measure-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        #alice-measure:not(:disabled):hover { background: rgba(0, 229, 255, 0.1); border-color: var(--alice-color); }
        #bob-measure:not(:disabled):hover { background: rgba(255, 0, 255, 0.1); border-color: var(--bob-color); }

        .result-box { height: 24px; text-align: center; font-size: 1.2rem; font-weight: bold; }

        /* Przycisk Następnej Rundy */
        #next-round-container {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: none; z-index: 10;
        }
        #next-round-btn {
            background: var(--text-color); color: var(--bg-color);
            padding: 12px 30px; font-size: 1.2rem; font-weight: bold;
            border: none; border-radius: 25px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2); transition: 0.2s;
        }
        #next-round-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,255,255,0.3); }
    </style>
</head>
<body>

    <header>
        <div class="score-board">Średni wynik: <span id="score-val">0.00</span></div>
        <div class="toggle-container">
            <span style="font-weight: bold;">Splątanie</span>
            <label class="switch">
                <input type="checkbox" id="entanglement-toggle" checked>
                <span class="slider-toggle"></span>
            </label>
        </div>
    </header>

    <main>
        <div id="alice-panel" class="panel">
            <h2>ALICE</h2>
            <div class="bit-display">Bit: <b id="alice-bit">-</b></div>
            <canvas id="alice-canvas" width="300" height="300"></canvas>
            
            <div class="controls">
                <div>
                    <div class="slider-label"><span>Oś pomiaru:</span><span id="alice-angle-val">0°</span></div>
                    <div class="preset-angles" id="alice-presets">
                        <button data-angle="0">0°</button>
                        <button data-angle="45">45°</button>
                        <button data-angle="90">90°</button>
                        <button data-angle="135">135°</button>
                    </div>
                    <input type="range" id="alice-slider" min="0" max="360" value="0">
                </div>
                <button class="measure-btn" id="alice-measure">Zmierz</button>
                <div class="result-box" id="alice-result"></div>
            </div>
        </div>

        <div id="bob-panel" class="panel">
            <h2>BOB</h2>
            <div class="bit-display">Bit: <b id="bob-bit">-</b></div>
            <canvas id="bob-canvas" width="300" height="300"></canvas>
            
            <div class="controls">
                <div>
                    <div class="slider-label"><span>Oś pomiaru:</span><span id="bob-angle-val">0°</span></div>
                    <div class="preset-angles" id="bob-presets">
                        <button data-angle="0">0°</button>
                        <button data-angle="45">45°</button>
                        <button data-angle="90">90°</button>
                        <button data-angle="135">135°</button>
                    </div>
                    <input type="range" id="bob-slider" min="0" max="360" value="0">
                </div>
                <button class="measure-btn" id="bob-measure">Zmierz</button>
                <div class="result-box" id="bob-result"></div>
            </div>
        </div>

        <div id="next-round-container">
            <button id="next-round-btn">Następna runda</button>
        </div>
    </main>

    <script>
        const state = {
            totalPoints: 0,
            roundsPlayed: 0,
            entangled: true,
            alice: { bit: 0, axis: 0, vector: null, measured: false, result: null, color: '#00e5ff' },
            bob:   { bit: 0, axis: 0, vector: null, measured: false, result: null, color: '#ff00ff' }
        };

        const els = {
            score: document.getElementById('score-val'),
            entToggle: document.getElementById('entanglement-toggle'),
            nextBtnContainer: document.getElementById('next-round-container'),
            nextBtn: document.getElementById('next-round-btn'),
            a: {
                bit: document.getElementById('alice-bit'),
                canvas: document.getElementById('alice-canvas'),
                ctx: document.getElementById('alice-canvas').getContext('2d'),
                slider: document.getElementById('alice-slider'),
                angleVal: document.getElementById('alice-angle-val'),
                presets: document.querySelectorAll('#alice-presets button'),
                measureBtn: document.getElementById('alice-measure'),
                result: document.getElementById('alice-result')
            },
            b: {
                bit: document.getElementById('bob-bit'),
                canvas: document.getElementById('bob-canvas'),
                ctx: document.getElementById('bob-canvas').getContext('2d'),
                slider: document.getElementById('bob-slider'),
                angleVal: document.getElementById('bob-angle-val'),
                presets: document.querySelectorAll('#bob-presets button'),
                measureBtn: document.getElementById('bob-measure'),
                result: document.getElementById('bob-result')
            }
        };

        const deg2rad = deg => (deg * Math.PI) / 180;
        const rad2deg = rad => (rad * 180) / Math.PI;

        function draw(playerKey) {
            const p = state[playerKey];
            const el = els[playerKey === 'alice' ? 'a' : 'b'];
            const ctx = el.ctx;
            const size = el.canvas.width;
            const cx = size / 2;
            const cy = size / 2;
            const radius = cx - 10;

            ctx.clearRect(0, 0, size, size);

            // Zewnętrzny okrąg bazy
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Oś pomiaru (przerywana linia)
        ctx.beginPath();
        const axisRad = deg2rad(p.axis);
        ctx.moveTo(cx - radius * Math.cos(axisRad), cy + radius * Math.sin(axisRad)); // Y odwrócone dla canvas
        ctx.lineTo(cx + radius * Math.cos(axisRad), cy - radius * Math.sin(axisRad));
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.setLineDash([5, 5]);
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]); // Reset dash

        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        let rT = radius - 22;
        ctx.fillText('|0>', cx + rT * Math.cos(axisRad), cy - rT * Math.sin(axisRad));
        ctx.fillText('|1>', cx - rT * Math.cos(axisRad), cy + rT * Math.sin(axisRad));

        // Wektor stanu (jeśli istnieje)
        if (p.vector !== null) {
            const vecRad = deg2rad(p.vector);
            const endX = cx + radius * Math.cos(vecRad);
                const endY = cy - radius * Math.sin(vecRad); // Y w górę = minus w canvas

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = p.color;
                ctx.lineWidth = 4;
                ctx.stroke();

                // Grot strzałki wektora
                ctx.save();
                ctx.translate(endX, endY);
                ctx.rotate(Math.PI / 2 - vecRad); 
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(-8, 12);
                ctx.lineTo(8, 12);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function measure(playerKey) {
            const p = state[playerKey];
            const otherKey = playerKey === 'alice' ? 'bob' : 'alice';
            const other = state[otherKey];
            const el = els[playerKey === 'alice' ? 'a' : 'b'];

            if (p.measured) return;

            let finalResult;
            let finalAngle;

            if (p.vector === null) {
                // Brak wektora - całkowicie losowy wynik (50/50)
                finalResult = Math.random() < 0.5 ? 0 : 1;
                finalAngle = finalResult === 0 ? p.axis : (p.axis + 180) % 360;
            } else {
                // Wektor istnieje (stan uległ wcześniej kolapsowi) - Prawo Malusa (cos^2)
                const diffRad = deg2rad(p.vector - p.axis);
                const prob0 = Math.pow(Math.cos(diffRad), 2);
                
                finalResult = Math.random() < prob0 ? 0 : 1;
                finalAngle = finalResult === 0 ? p.axis : (p.axis + 180) % 360;
            }

            p.measured = true;
            p.result = finalResult;
            p.vector = finalAngle;

            // Efekt Splątania - natychmiastowe ustawienie wektora drugiej osoby
            if (state.entangled && !other.measured) {
                other.vector = finalAngle;
                draw(otherKey); // Aktualizuj płótno partnera by pokazać kolaps
            }

            // Aktualizacja UI
            el.result.innerText = `Wynik: ${finalResult}`;
            el.result.style.color = p.color;
            el.measureBtn.disabled = true;
            el.slider.disabled = true;
            el.presets.forEach(btn => btn.disabled = true);

            draw(playerKey);
            checkRoundEnd();
        }

        function checkRoundEnd() {
            if (state.alice.measured && state.bob.measured) {
                state.roundsPlayed++;
                
                const resultsMatch = (state.alice.result === state.bob.result);
                const isOneOne = (state.alice.bit === 1 && state.bob.bit === 1);

                if (resultsMatch) {
                    if (isOneOne) {
                        state.totalPoints -= 1;
                        els.score.style.color = "#ff4444";
                    } else {
                        state.totalPoints += 1;
                        els.score.style.color = "#4CAF50";
                    }
                } else {
                    els.score.style.color = "#aaaaaa";
                }
                
                const avg = (state.totalPoints / state.roundsPlayed).toFixed(2);
                els.score.innerText = avg;
                setTimeout(() => els.score.style.color = "var(--text-color)", 1000);

                els.nextBtnContainer.style.display = 'block';
            }
        }

        function initRound() {
            els.nextBtnContainer.style.display = 'display: none';
            state.entangled = els.entToggle.checked;
            
            // Nowe losowe bity dla każdej rundy
            state.alice.bit = Math.random() < 0.5 ? 0 : 1;
            state.bob.bit = Math.random() < 0.5 ? 0 : 1;
            
            els.a.bit.innerText = state.alice.bit;
            els.b.bit.innerText = state.bob.bit;

            // Reset stanu pomiarów i UI dla obu graczy
            ['alice', 'bob'].forEach(key => {
                const p = state[key];
                const el = els[key === 'alice' ? 'a' : 'b'];
                
                p.measured = false;
                p.result = null;
                p.vector = null; // Wektor ukryty do momentu pomiaru lub kolapsu

                el.result.innerText = "";
                el.measureBtn.disabled = false;
                el.slider.disabled = false;
                el.presets.forEach(btn => btn.disabled = false);
                
                draw(key);
            });
            
            els.nextBtnContainer.style.display = 'none';
        }

        // Podpięcie Zdarzeń
        els.entToggle.addEventListener('change', initRound);
        els.nextBtn.addEventListener('click', initRound);

        ['alice', 'bob'].forEach(key => {
            const el = els[key === 'alice' ? 'a' : 'b'];
            
            el.slider.addEventListener('input', (e) => {
                state[key].axis = parseInt(e.target.value);
                el.angleVal.innerText = `${state[key].axis}°`;
                draw(key);
            });

            el.presets.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const angle = parseInt(e.target.dataset.angle);
                    state[key].axis = angle;
                    el.slider.value = angle;
                    el.angleVal.innerText = `${angle}°`;
                    draw(key);
                });
            });

            el.measureBtn.addEventListener('click', () => measure(key));
        });

        // Inicjalizacja pierwszej rundy
        initRound();

    </script>
</body>
</html>
